org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kept off on purpose: most plugins in this app still apply the legacy
# `kotlin-android` plugin, which AGP 9 refuses to combine with built-in Kotlin.
# The one plugin that assumed built-in Kotlin (cloud_functions) is vendored
# under packages/cloud_functions and pinned to the legacy plugin instead.
android.builtInKotlin=false
# Flutter's Gradle plugin still uses the legacy Android DSL, which AGP 9 no
# longer enables by default.
android.newDsl=false
